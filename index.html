<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nihongo Flashcards SRS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; overscroll-behavior: none; }
        
        /* Card Stack Styles */
        .card-stack { perspective: 1000px; position: relative; height: 60vh; width: 100%; display: flex; justify-content: center; align-items: center; }
        .flashcard {
            position: absolute; width: 90%; height: 100%;
            background: white; border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: transform 0.3s ease, opacity 0.3s ease, box-shadow 0.3s ease;
            will-change: transform, opacity;
            backface-visibility: hidden;
            border: 1px solid #f3f4f6;
            cursor: grab;
        }
        .flashcard:active { cursor: grabbing; }

        /* Status Badges on Swipe */
        .status-badge {
            position: absolute; top: 20px; padding: 5px 15px; border-radius: 8px;
            font-weight: bold; font-size: 1.2rem; opacity: 0; transition: opacity 0.2s;
            border: 3px solid; z-index: 10;
        }
        .status-again { right: 20px; color: #ef4444; border-color: #ef4444; transform: rotate(15deg); }
        .status-good { left: 20px; color: #22c55e; border-color: #22c55e; transform: rotate(-15deg); }
        .status-easy { bottom: 20px; left: 50%; transform: translateX(-50%); color: #3b82f6; border-color: #3b82f6; }

        /* UI Helpers */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animations */
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen w-screen overflow-hidden flex flex-col">

    <header class="px-5 pt-4 pb-2 flex justify-between items-center bg-white shadow-sm z-20">
        <div class="flex items-center gap-2">
            <div class="bg-orange-100 p-2 rounded-full text-orange-500"><i class="fas fa-fire"></i></div>
            <div>
                <p class="text-xs text-gray-500 font-bold">STREAK</p>
                <p class="text-sm font-bold" id="streak-count">0 Ngày</p>
            </div>
        </div>
        <div class="flex-1 mx-4">
            <div class="flex justify-between text-xs mb-1 text-gray-500">
                <span id="due-count">Due: 0</span>
                <span id="retention-rate">0% Nhớ</span>
            </div>
            <div class="h-2 w-full bg-gray-200 rounded-full overflow-hidden">
                <div id="progress-bar" class="h-full bg-indigo-500 transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>
        <button onclick="toggleView('admin')" class="text-gray-400 hover:text-indigo-600 transition">
            <i class="fas fa-cog fa-lg"></i>
        </button>
    </header>

    <main id="view-learn" class="flex-1 flex flex-col justify-center items-center relative p-4 overflow-hidden">
        
        <div id="empty-state" class="hidden flex-col items-center text-center animate-float">
            <div class="text-6xl mb-4">🎉</div>
            <h2 class="text-2xl font-bold text-gray-800">Hoàn thành!</h2>
            <p class="text-gray-500 mt-2">Bạn đã học hết thẻ của hôm nay.</p>
            <button onclick="app.resetDueDatesForDemo()" class="mt-6 px-6 py-2 bg-indigo-100 text-indigo-600 rounded-full font-bold text-sm">
                Reset để học lại
            </button>
        </div>

        <div id="card-stack" class="card-stack">
            </div>

        <div id="swipe-hint" class="absolute bottom-24 w-full flex justify-between px-8 text-gray-300 text-2xl pointer-events-none transition-opacity duration-300">
            <i class="fas fa-chevron-left"></i>
            <i class="fas fa-chevron-right"></i>
        </div>
    </main>

    <footer id="controls" class="pb-6 px-4 flex justify-between gap-3 max-w-md mx-auto w-full z-20">
        <button onclick="app.handleAnswer('again')" class="flex-1 py-3 rounded-xl bg-red-100 text-red-600 font-bold shadow-sm hover:bg-red-200 transition">
            <div class="text-xs opacity-70">1m</div>Lại
        </button>
        <button onclick="app.handleAnswer('hard')" class="flex-1 py-3 rounded-xl bg-orange-100 text-orange-600 font-bold shadow-sm hover:bg-orange-200 transition">
            <div class="text-xs opacity-70">10m</div>Khó
        </button>
        <button onclick="app.handleAnswer('good')" class="flex-1 py-3 rounded-xl bg-green-100 text-green-600 font-bold shadow-sm hover:bg-green-200 transition">
            <div class="text-xs opacity-70">1d</div>Tốt
        </button>
        <button onclick="app.handleAnswer('easy')" class="flex-1 py-3 rounded-xl bg-blue-100 text-blue-600 font-bold shadow-sm hover:bg-blue-200 transition">
            <div class="text-xs opacity-70">4d</div>Dễ
        </button>
    </footer>

    <div id="view-admin" class="fixed inset-0 bg-white z-50 transform translate-y-full transition-transform duration-300 flex flex-col">
        <div class="p-4 border-b flex justify-between items-center bg-gray-50">
            <h2 class="font-bold text-lg">Quản trị & Cài đặt</h2>
            <button onclick="toggleView('learn')" class="p-2 text-gray-500"><i class="fas fa-times fa-lg"></i></button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 space-y-6">
            
            <section class="bg-white p-4 rounded-xl border shadow-sm">
                <h3 class="font-bold text-gray-700 mb-3"><i class="fas fa-link mr-2"></i>API Configuration</h3>
                <input type="text" id="api-url" placeholder="Endpoint URL (e.g., example.com/api)" class="w-full p-2 border rounded mb-2 text-sm">
                
                <div id="login-form">
                    <input type="text" id="api-user" placeholder="Username" class="w-full p-2 border rounded mb-2 text-sm">
                    <input type="password" id="api-pass" placeholder="Password" class="w-full p-2 border rounded mb-2 text-sm">
                    <button onclick="admin.login()" class="w-full bg-indigo-600 text-white p-2 rounded font-bold">Đăng nhập</button>
                </div>
                
                <div id="logged-in-view" class="hidden">
                    <p class="text-green-600 text-sm mb-2"><i class="fas fa-check-circle"></i> Đã đăng nhập</p>
                    <button onclick="admin.logout()" class="text-red-500 text-sm underline">Đăng xuất</button>
                </div>
            </section>

            <section id="card-manager" class="bg-white p-4 rounded-xl border shadow-sm opacity-50 pointer-events-none transition-opacity">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-gray-700"><i class="fas fa-database mr-2"></i>Quản lý thẻ</h3>
                    <button onclick="admin.openEditModal()" class="bg-indigo-100 text-indigo-600 px-3 py-1 rounded-lg text-sm font-bold">+ Thêm mới</button>
                </div>
                
                <div class="max-h-60 overflow-y-auto border rounded divide-y" id="admin-card-list">
                    </div>
                <button onclick="app.loadCards()" class="mt-2 w-full text-indigo-600 text-sm font-bold">Reload từ API</button>
            </section>
        </div>
    </div>

    <div id="modal-edit" class="fixed inset-0 bg-black bg-opacity-50 z-[60] hidden flex justify-center items-center p-4">
        <div class="bg-white w-full max-w-sm rounded-xl p-5 shadow-xl">
            <h3 class="font-bold text-lg mb-4" id="modal-title">Thêm thẻ mới</h3>
            <input type="hidden" id="edit-id">
            <div class="space-y-3">
                <input id="edit-kanji" class="w-full p-2 border rounded" placeholder="Kanji (Ví dụ: 猫)">
                <input id="edit-kana" class="w-full p-2 border rounded" placeholder="Kana (Ví dụ: ねこ)">
                <input id="edit-meaning" class="w-full p-2 border rounded" placeholder="Nghĩa (Ví dụ: Con mèo)">
                <textarea id="edit-example" class="w-full min-h-28 p-2 border rounded" placeholder="Ví dụ (Câu mẫu)"></textarea>
            </div>
            <div class="mt-5 flex gap-3">
                <button onclick="document.getElementById('modal-edit').classList.add('hidden')" class="flex-1 py-2 bg-gray-100 rounded text-gray-600 font-bold">Hủy</button>
                <button onclick="admin.saveCard()" class="flex-1 py-2 bg-indigo-600 rounded text-white font-bold">Lưu</button>
            </div>
        </div>
    </div>
	
	<div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-[100] hidden flex flex-col justify-center items-center transition-opacity">
		<div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-indigo-500 border-white mb-4"></div>
		<p class="text-white font-bold text-lg animate-pulse">Đang xử lý...</p>
	</div>

    <script>
        // --- CONFIG & STATE ---
        const MOCK_DATA = [
            { id: '1', kanji: '猫', kana: 'ねこ', meaning: 'Con mèo', example: '猫が好きです (Tôi thích mèo)' },
            { id: '2', kanji: '勉強', kana: 'べんきょう', meaning: 'Học tập', example: '日本語を勉強します (Tôi học tiếng Nhật)' },
            { id: '3', kanji: '食べる', kana: 'たべる', meaning: 'Ăn', example: 'パンを食べる (Ăn bánh mì)' },
            { id: '4', kanji: '新しい', kana: 'あたらしい', meaning: 'Mới', example: '新しい車 (Xe mới)' },
            { id: '5', kanji: '会社', kana: 'かいしゃ', meaning: 'Công ty', example: '会社に行きます (Đi đến công ty)' }
        ];

        const state = {
            cards: [],       // All card data
            dueCards: [],    // Cards pending review
            progress: {},    // Map: cardId -> { nextReview, interval, ease }
            stats: {
                streak: 0,
                lastStudyDate: null,
                totalLearned: 0,
                timeSpent: 0
            },
            settings: {
                apiUrl: 'https://script.google.com/macros/s/AKfycbxRqC15kBAucFNyEcJ2k2mk_EQR5635bCUzoRZccmFt8KbtC6KymYlhN2_yPLT_Nwul/exec',
                token: null,
                username: null
            },
            startTime: Date.now()
        };

        // --- CORE APP LOGIC ---
        const app = {
            init: async () => {
                app.loadSettings();
                app.loadProgress();
                await app.loadCards();
                app.calculateDueCards();
                ui.render();
                ui.renderStats();
                
                // Save study time every 30s
                setInterval(() => {
                    const now = Date.now();
                    state.stats.timeSpent += (now - state.startTime) / 60000;
                    state.startTime = now;
                    app.saveProgress();
                }, 30000);
            },

            loadSettings: () => {
                const stored = localStorage.getItem('srs_settings');
                if (stored) state.settings = JSON.parse(stored);
                document.getElementById('api-url').value = state.settings.apiUrl;
                if (state.settings.token) admin.setLoggedInState(true);
            },

            loadProgress: () => {
                const stored = localStorage.getItem('srs_progress');
                if (stored) {
                    const data = JSON.parse(stored);
                    state.progress = data.progress || {};
                    state.stats = data.stats || state.stats;
                }
                // Check streak
                const today = new Date().toDateString();
                if (state.stats.lastStudyDate !== today) {
                    const yesterday = new Date();
                    yesterday.setDate(yesterday.getDate() - 1);
                    if (state.stats.lastStudyDate !== yesterday.toDateString()) {
                        if (state.stats.lastStudyDate !== today) state.stats.streak = 0; // Reset if broken
                    }
                }
            },

            saveProgress: () => {
                state.stats.lastStudyDate = new Date().toDateString();
                localStorage.setItem('srs_progress', JSON.stringify({
                    progress: state.progress,
                    stats: state.stats
                }));
                ui.renderStats();
            },

            loadCards: async () => {
                // Try API first, fallback to mock
                if (state.settings.apiUrl) {
                    try {
					    ui.showLoading(true);
                        const url = `${state.settings.apiUrl}?action=getFlashCards`;
                        
                        console.log("Fetching from API:", url);
						const res = await fetch(url);
						const result = await res.json();

						if (result.success && Array.isArray(result.data)) {
							console.log("Data from API:", result.data);
							state.cards = result.data;
						} else {
							console.warn("Get data fail -> use mock");
							state.cards = [...MOCK_DATA];
						}
                        
                    } catch (e) {
                        state.cards = [...MOCK_DATA];
                    } finally {
						ui.showLoading(false);
					}
                } else {
                    state.cards = [...MOCK_DATA];
                }
                admin.renderCardList();
				app.calculateDueCards(); 
				ui.render();
            },

            calculateDueCards: () => {
                const now = Date.now();
                state.dueCards = state.cards.filter(card => {
                    const prog = state.progress[card.id];
                    if (!prog) return true; // New card
                    return prog.nextReview <= now;
                });
                // Shuffle slightly
                state.dueCards.sort(() => Math.random() - 0.5);
            },

            // SRS Algorithm (Simplified SM-2)
            handleAnswer: (quality) => {
                if (state.dueCards.length === 0) return;

                const card = state.dueCards[0]; // Top card
                const prog = state.progress[card.id] || { interval: 0, ease: 2.5 };
                
                let nextIntervalMin = 0; // Minutes

                switch (quality) {
                    case 'again': // 1 min
                        nextIntervalMin = 1;
                        prog.interval = 0; 
                        break;
                    case 'hard': // 10 min
                        nextIntervalMin = 10;
                        prog.interval = 0;
                        prog.ease = Math.max(1.3, prog.ease - 0.15);
                        break;
                    case 'good': // 1 day * interval
                        if (prog.interval === 0) prog.interval = 1;
                        else if (prog.interval === 1) prog.interval = 6;
                        else prog.interval = Math.round(prog.interval * prog.ease);
                        nextIntervalMin = prog.interval * 24 * 60;
                        break;
                    case 'easy': // 4 days * interval
                         if (prog.interval === 0) prog.interval = 4;
                         else prog.interval = Math.round(prog.interval * prog.ease * 1.3);
                         prog.ease += 0.15;
                         nextIntervalMin = prog.interval * 24 * 60;
                        break;
                }

                // Update Progress
                state.progress[card.id] = {
                    ...prog,
                    nextReview: Date.now() + (nextIntervalMin * 60 * 1000)
                };

                // Update Stats
                state.stats.totalLearned++;
                if (state.stats.streak === 0) state.stats.streak = 1;

                app.saveProgress();

                // Remove from stack UI and Logic
                ui.removeTopCard(quality);
                setTimeout(() => {
                    state.dueCards.shift();
                    ui.render(); // Re-render stack
                    // If queue empty, show finished
                    if (state.dueCards.length === 0) ui.showEmptyState();
                }, 300); // Wait for animation
            },

            resetDueDatesForDemo: () => {
                state.progress = {};
                app.saveProgress();
                app.calculateDueCards();
                ui.hideEmptyState();
                ui.render();
            }
        };

        // --- ADMIN / API LOGIC ---
        const admin = {
			// --- LOGIN: Lấy token ---
			login: async () => {
				const u = document.getElementById('api-user').value.trim();
				const p = document.getElementById('api-pass').value.trim();
				const url = document.getElementById('api-url').value.trim();

				if (!url || !u || !p) {
					alert("Vui lòng nhập đầy đủ URL, Username và Password!");
					return;
				}

				try {
					ui.showLoading(true);
					// Cấu trúc: GET ?action=login&username=...&password=...
					const endpoint = `${url}?action=login&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`;
					
					const response = await fetch(endpoint);
					const result = await response.json();

					if (result.success) {
						// LƯU TOKEN VÀO STATE VÀ LOCALSTORAGE
						state.settings.username = result.data.username;
						state.settings.token = result.data.token;
						state.settings.apiUrl = url;

						localStorage.setItem('srs_settings', JSON.stringify(state.settings));
						
						admin.setLoggedInState(true);
						
						// Tải lại dữ liệu thẻ sau khi login
						await app.loadCards(); 
						admin.renderCardList();
						
						alert("Đăng nhập thành công!");
					} else {
						alert("Đăng nhập thất bại: " + (result.message || "Lỗi không xác định"));
					}
				} catch (e) {
					console.error(e);
					alert("Lỗi kết nối đến server login!");
				} finally {
					ui.showLoading(false);
				}
			},

			logout: () => {
				if(confirm("Bạn muốn đăng xuất?")) {
					state.settings.token = null;
					state.settings.username = null;
					localStorage.setItem('srs_settings', JSON.stringify(state.settings));
					admin.setLoggedInState(false);
					location.reload(); // Reload để reset trạng thái
				}
			},

			setLoggedInState: (isLoggedIn) => {
				const form = document.getElementById('login-form');
				const loggedView = document.getElementById('logged-in-view');
				const manager = document.getElementById('card-manager');
				
				if (isLoggedIn) {
					form.classList.add('hidden');
					loggedView.classList.remove('hidden');
					// Mở khóa chức năng quản lý thẻ
					manager.classList.remove('opacity-50', 'pointer-events-none');
					// Hiển thị tên user
					loggedView.querySelector('p').innerHTML = `<i class="fas fa-check-circle"></i> Xin chào, <b>${state.settings.username}</b>`;
				} else {
					form.classList.remove('hidden');
					loggedView.classList.add('hidden');
					manager.classList.add('opacity-50', 'pointer-events-none');
				}
			},

			// --- RENDER LIST ---
			renderCardList: () => {
				const list = document.getElementById('admin-card-list');
				if(!state.cards || state.cards.length === 0) {
					list.innerHTML = '<p class="text-center text-gray-400 p-4">Chưa có thẻ nào.</p>';
					return;
				}
				list.innerHTML = state.cards.map(c => `
					<div class="p-3 flex justify-between items-center bg-gray-50 hover:bg-white border-b last:border-0">
						<div class="truncate pr-4">
							<span class="font-bold text-indigo-700">${c.kanji}</span>
							<span class="text-xs text-gray-500 block truncate">${c.meaning}</span>
						</div>
						<div class="flex gap-3 shrink-0">
							<button onclick="admin.openEditModal('${c.id}')" class="text-blue-500 hover:text-blue-700"><i class="fas fa-edit"></i></button>
							<button onclick="admin.deleteCard('${c.id}')" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button>
						</div>
					</div>
				`).join('');
			},

			openEditModal: (id = null) => {
				const modal = document.getElementById('modal-edit');
				document.getElementById('edit-id').value = id || '';
				
				if (id) {
					const c = state.cards.find(x => x.id == id); // Dùng == để so sánh cả string/number
					if(c) {
						document.getElementById('modal-title').innerText = 'Sửa thẻ';
						document.getElementById('edit-kanji').value = c.kanji;
						document.getElementById('edit-kana').value = c.kana;
						document.getElementById('edit-meaning').value = c.meaning;
						document.getElementById('edit-example').value = c.example;
					}
				} else {
					document.getElementById('modal-title').innerText = 'Thêm thẻ mới';
					// Reset form
					document.querySelectorAll('#modal-edit input:not([type=hidden])').forEach(i => i.value = '');
				}
				modal.classList.remove('hidden');
			},

			// --- ADD / UPDATE (Dùng Token) ---
			saveCard: async () => {
				const id = document.getElementById('edit-id').value;
				const apiUrl = state.settings.apiUrl;
				const token = state.settings.token;

				if (!token) {
					alert("Bạn chưa đăng nhập hoặc phiên làm việc hết hạn!");
					return;
				}

				const payload = {
					token: token,
					kanji: document.getElementById('edit-kanji').value,
					kana: document.getElementById('edit-kana').value,
					meaning: document.getElementById('edit-meaning').value,
					example: document.getElementById('edit-example').value
				};

				// Xác định Action là Add hay Update
				if (id) {
					payload.action = 'updateFlashCard';
					payload.id = id;
				} else {
					payload.action = 'addFlashCard';
				}

				try {
					ui.showLoading(true);
					// Gửi request POST JSON
					const response = await fetch(apiUrl, {
						method: 'POST',
						//headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify(payload)
					});

					const result = await response.json();

					if (result.success) {
						// Load lại danh sách mới nhất từ server để đồng bộ
						await app.loadCards();
						
						document.getElementById('modal-edit').classList.add('hidden');	
						alert(id ? "Cập nhật thành công!" : "Thêm mới thành công!");
					} else {
						alert("Lỗi: " + result.message);
					}
				} catch (e) {
					console.error(e);
					alert("Lỗi kết nối khi lưu thẻ!");
				} finally {
					ui.showLoading(false);
				}
			},

			// --- DELETE (Dùng Token) ---
			deleteCard: async (id) => {
				if(!confirm('Bạn chắc chắn muốn xóa thẻ này?')) return;
				
				const apiUrl = state.settings.apiUrl;
				const token = state.settings.token;

				if (!token) {
					alert("Lỗi token! Vui lòng đăng nhập lại.");
					return;
				}

				try {
					ui.showLoading(true);
					
					const payload = {
						action: 'deleteFlashCard',
						token: token,
						id: id
					};

					const response = await fetch(apiUrl, {
						method: 'POST',
						//headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify(payload)
					});

					const result = await response.json();

					if (result.success) {
						// Xóa thành công thì load lại data
						await app.loadCards();
					} else {
						alert("Không thể xóa: " + result.message);
					}
				} catch (e) {
					console.error(e);
					alert("Lỗi kết nối khi xóa thẻ!");
				} finally {
					ui.showLoading(false);
				}
			}
		};

        // --- UI & INTERACTIONS ---
        const ui = {
            render: () => {
                const stack = document.getElementById('card-stack');
                stack.innerHTML = '';
                
                if (state.dueCards.length === 0) {
                    ui.showEmptyState();
                    return;
                }
                ui.hideEmptyState();

                // Render top 3 cards only (Performance)
                const toRender = state.dueCards.slice(0, 3).reverse(); 
                
                toRender.forEach((card, index) => {
                    const realIndex = state.dueCards.indexOf(card);
                    const el = document.createElement('div');
                    el.className = 'flashcard shadow-xl';
                    
                    // Card Stacking Effect
                    const offset = (toRender.length - 1 - index) * 10; // 0, 10, 20
                    const scale = 1 - (toRender.length - 1 - index) * 0.05;
                    
                    el.style.top = `${offset}px`;
                    el.style.zIndex = index;
                    el.style.transform = `scale(${scale})`;
                    
                    // Content
                    el.innerHTML = `
                        <div class="status-badge status-again text-2xl border-4">LẠI</div>
                        <div class="status-badge status-good text-2xl border-4">TỐT</div>
                        <div class="status-badge status-easy text-2xl border-4">DỄ</div>
                        
                        <div class="text-center p-6 pointer-events-none select-none">
                            <h2 class="text-6xl font-bold mb-2 text-gray-800">${card.kanji}</h2>
                            <p class="text-2xl text-gray-600 mb-6 font-medium">${card.kana}</p>
                            
                            <div class="mt-8 pt-6 border-t border-gray-100 w-full">
                                <p class="text-xl font-bold text-indigo-600 mb-2 reveal-item opacity-0 transition-opacity">${card.meaning}</p>
                                <p class="text-sm text-gray-400 italic reveal-item opacity-0 transition-opacity">"${card.example}"</p>
                            </div>
                            <p class="mt-8 text-gray-300 text-xs">Chạm để xem nghĩa</p>
                        </div>
                    `;

                    // Top card gets event listeners
                    if (index === toRender.length - 1) {
                        ui.attachTouchEvents(el);
                        el.onclick = () => {
                            el.querySelectorAll('.reveal-item').forEach(i => i.classList.remove('opacity-0'));
                        };
                    }
                    stack.appendChild(el);
                });
                
                ui.renderStats();
            },

            attachTouchEvents: (card) => {
                let startX, startY, currentX, currentY;
                let isDragging = false;
                const threshold = 100; // px to trigger
                const screenW = window.innerWidth;

                const onMove = (e) => {
                    if (!isDragging) return;
                    e.preventDefault(); // Prevent scrolling
                    
                    const touch = e.touches[0];
                    currentX = touch.clientX - startX;
                    currentY = touch.clientY - startY;
                    
                    // Logic: Rotation based on X
                    const rotate = currentX * 0.05;
                    
                    // Status Opacity Logic
                    const againOp = Math.max(0, -currentX / (threshold*1.5));
                    const goodOp = Math.max(0, currentX / (threshold*1.5));
                    const easyOp = Math.max(0, -currentY / (threshold*1.5)); // Swipe Up
                    
                    card.querySelector('.status-again').style.opacity = againOp;
                    card.querySelector('.status-good').style.opacity = goodOp;
                    
                    // Priority for Easy (Up)
                    if (currentY < -50 && Math.abs(currentX) < 50) {
                         card.querySelector('.status-easy').style.opacity = easyOp;
                         card.style.transform = `translate(0px, ${currentY}px)`;
                    } else {
                         card.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;
                    }
                };

                const onEnd = () => {
                    if (!isDragging) return;
                    isDragging = false;
                    
                    // Detect Swipe Direction
                    if (currentY < -threshold && Math.abs(currentX) < 80) {
                        // Swipe Up -> Easy
                        app.handleAnswer('easy');
                    } else if (currentX > threshold) {
                        // Swipe Right -> Good
                        app.handleAnswer('good');
                    } else if (currentX < -threshold) {
                        // Swipe Left -> Again
                        app.handleAnswer('again');
                    } else {
                        // Reset
                        card.style.transform = `translate(0px, 0px) scale(1)`;
                        card.querySelectorAll('.status-badge').forEach(b => b.style.opacity = 0);
                    }
                };

                card.addEventListener('touchstart', (e) => {
                    isDragging = true;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    card.style.transition = 'none';
                });
                card.addEventListener('touchmove', onMove);
                card.addEventListener('touchend', () => {
                    card.style.transition = 'transform 0.3s ease';
                    onEnd();
                });
            },

            removeTopCard: (direction) => {
                const card = document.querySelector('.card-stack').lastElementChild;
                if (!card) return;

                let x = 0, y = 0, rot = 0;
                if (direction === 'again') { x = -500; rot = -30; }
                if (direction === 'good') { x = 500; rot = 30; }
                if (direction === 'easy') { y = -500; }
                if (direction === 'hard') { y = 500; } // Fallback for button

                card.style.transition = 'transform 0.4s ease, opacity 0.4s';
                card.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
                card.style.opacity = '0';
            },

            showEmptyState: () => {
                document.getElementById('card-stack').classList.add('hidden');
                document.getElementById('controls').classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('empty-state').classList.remove('hidden');
                document.getElementById('empty-state').classList.add('flex');
            },
            hideEmptyState: () => {
                document.getElementById('card-stack').classList.remove('hidden');
                document.getElementById('controls').classList.remove('opacity-0', 'pointer-events-none');
                document.getElementById('empty-state').classList.add('hidden');
                document.getElementById('empty-state').classList.remove('flex');
            },

            renderStats: () => {
                const total = state.cards.length;
                const learned = Object.keys(state.progress).length;
                const due = state.dueCards.length;
                const retention = total > 0 ? Math.round((learned / total) * 100) : 0;
                
                document.getElementById('due-count').innerText = `Cần học: ${due}`;
                document.getElementById('retention-rate').innerText = `${retention}% Nhớ`;
                document.getElementById('streak-count').innerText = `${state.stats.streak} Ngày`;
                
                const percent = total > 0 ? (learned / total) * 100 : 0;
                document.getElementById('progress-bar').style.width = `${percent}%`;
            },
			
			showLoading: (isLoading) => {
				// Có thể thêm một spinner overlay vào HTML và toggle class hidden ở đây
				const btn = document.querySelector('button[onclick="app.loadCards()"]');
				if(btn) btn.innerText = isLoading ? "Đang tải..." : "Reload từ API";
				
				const overlay = document.getElementById('loading-overlay');
				if (!overlay) return;

				if (isLoading) {
					overlay.classList.remove('hidden');
				} else {
					// Thêm chút delay nhỏ để trải nghiệm mượt hơn (tránh nháy màn hình nếu load quá nhanh)
					setTimeout(() => {
						overlay.classList.add('hidden');
					}, 300);
				}
			}
        };

        // Helper to switch views
        function toggleView(viewName) {
            const adminPanel = document.getElementById('view-admin');
            if (viewName === 'admin') {
                adminPanel.classList.remove('translate-y-full');
            } else {
                adminPanel.classList.add('translate-y-full');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', app.init);

    </script>
</body>
</html>
